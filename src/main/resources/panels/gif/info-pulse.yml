# HudBoard - info-pulse (1x1 = 128x128)
# Animated pulsing background (pulse.gif) with a "LIVE" indicator + TPS.
# Use as a "your server is healthy" / "your TPS is great" badge.
#
# Convention: `text` = raw data, `base-color` = MiniMessage tag applied to
# the whole text.

name: "<gradient:#4ade80:#22d3ee>Pulse</gradient>"
description: "Animated pulse background with a live TPS indicator. Good for 'server health' badges."
permission: hudboard.use
tiles-w: 1
tiles-h: 1

data-points:
  label:
    tile-x: 0
    tile-y: 0
    x: 48
    y: 26
    text: "LIVE"
    size: 8
    color: 0xFFFFFF
    base-color: "<white>"
  tps:
    tile-x: 0
    tile-y: 0
    x: 38
    y: 60
    text: "<b>%server_tps%</b>"
    size: 30
    color: 0xFFFFFF
    base-color: "<white>"
  hint:
    tile-x: 0
    tile-y: 0
    x: 24
    y: 102
    text: "TPS"
    size: 10
    color: 0x808080
    base-color: "<gray>"
